<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Sistema Financeiro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>Painel Financeiro</h1>

<div class="box">
  <h2>Adicionar Agente</h2>
  <input id="agentName" placeholder="Nome do agente" />
  <button onclick="addAgent()">Adicionar</button>
</div>

<div class="box">
  <h2>Registrar Venda</h2>
  <select id="agentSelect"></select>
  <input id="amount" type="number" placeholder="Valor" />
  <button onclick="addSale()">Registrar</button>
</div>

<div class="box">
  <h2>Agentes</h2>
  <ul id="agentList"></ul>
</div>

<div class="box">
  <h2>Comissões</h2>
  <ul id="commissionList"></ul>
</div>

<script src="app.js"></script>
</body>
</html>
